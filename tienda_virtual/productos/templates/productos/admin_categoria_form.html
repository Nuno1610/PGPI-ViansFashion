{% extends "base.html" %}

{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/formulario_categorias.css' %}">

<div class="form-container">
    <h2>{{ accion }} categoría</h2>

    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <div class="{% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{{ accion }}</button>
    </form>
</div>

{% endblock %}
